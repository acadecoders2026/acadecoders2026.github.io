<html>
  <head>
    <title>AcadeCoders 2026</title>
    <link rel="stylesheet" href="../../../styles.css"/>
  </head>
  <body>

    <hr>
    <h2>/ Songs</h2>
    <ul id="songs">
    </ul>
    

    <script>
        const songs = [
            "DJ Song.mp3",
            "Dramatic Song.mp3",
            "Exciting Song.mp3",
            "Mad Song.mp3",
            "project-sample.mp3",
            "Random Song.mp3",
            "Sad Song.mp3",
            "Super Scary Song.mp3"

        ];

        const list = document.getElementById("songs");

        songs.forEach(song => {
            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "songs/" + song;
            a.textContent = song.replace(/\.(mp3|wav)$/i, "");

            li.appendChild(a);
            list.appendChild(li);
        });
    </script>
  </body>
</html>

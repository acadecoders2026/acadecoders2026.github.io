<html>
  <head>
    <title>AcadeCoders 2026</title>
    <link rel="stylesheet" href="../../../styles.css"/>
  </head>
  <body>

    <hr>
    <h2>/ Songs</h2>
    <ul id="songs">
    </ul>
    

    <script>
        const songs = [
            "project-sample-1.wav",
            "project-sample-2.wav",
            "project-sample-3.wav",
            "project-sample-4.wav",
            "project-sample-5.wav",
            "project-sample-6.wav",
            "project-sample-7.wav",
            "project-sample-8.wav",
            "finlays songs.wav",
            "Ableton-Synth-2.wav",
            "Ableton-Synth-1.wav"
        ];

        const list = document.getElementById("songs");

        songs.forEach(song => {
            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "songs/" + song;
            a.textContent = song.replace(/\.(mp3|wav)$/i, "");

            li.appendChild(a);
            list.appendChild(li);
        });
    </script>
  </body>
</html>

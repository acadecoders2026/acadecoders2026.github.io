<html>
  <head>
    <title>AcadeCoders 2026</title>
    <link rel="stylesheet" href="../../../styles.css"/>
  </head>
  <body>
    Sorry Nora the songs were not named when we exported them so they have strange names
    <hr>
    <h2>/ Songs</h2>
    <ul id="songs">
    </ul>
    

    <script>
        const songs = [
            "2026-08-07T13_17_18.989Z.mp3",
            "project-sample-1.mp3",
            "2bars-x1-90bpm.mp3",
            "2bars-x1-90bpm-2.mp3",
            "1bars-x1-90bpm.mp3",
            "Ableton-Synth-4.mp3",
            "Ableton-Synth-1.mp3",
            "Ableton-Synth-2.mp3",
            "Ableton-Synth-3.mp3"
        ];

        const list = document.getElementById("songs");

        songs.forEach(song => {
            const li = document.createElement("li");
            const a = document.createElement("a");

            a.href = "songs/" + song;
            a.textContent = song.replace(/\.(mp3|wav)$/i, "");

            li.appendChild(a);
            list.appendChild(li);
        });
    </script>
  </body>
</html>
